<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Orbe Activo — Hito 7 (Misións 2 e 3)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{
    --oro:#C8A84B; --oro-vivo:#F4D35E; --verde:#1D5C4A;
    --verde-oscuro:#0E3328; --crema:#F5EFE0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:Georgia,serif;background:#1a1410;}
  #app{height:100vh;display:flex;align-items:center;justify-content:center;}
  #movil{width:100%;max-width:420px;height:100vh;max-height:880px;background:var(--verde-oscuro);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .pantalla{position:absolute;inset:0;display:none;flex-direction:column;}
  .pantalla.activa{display:flex;}

  #bienvenida{background:radial-gradient(circle at 50% 30%,var(--verde) 0%,var(--verde-oscuro) 70%);justify-content:center;padding:40px 32px;text-align:center;overflow-y:auto;}
  .hada{font-size:46px;color:var(--oro-vivo);text-shadow:0 0 20px rgba(244,211,94,.6);margin-bottom:6px;}
  #bienvenida h1{font-size:30px;color:var(--crema);font-weight:normal;letter-spacing:1px;}
  .subt{font-size:14px;color:var(--oro-vivo);font-style:italic;margin-bottom:20px;}
  .intro{font-size:14px;color:rgba(245,239,224,.75);line-height:1.6;margin-bottom:14px;}
  .btn-grande{margin-top:14px;width:100%;padding:16px;background:var(--oro);color:var(--verde-oscuro);border:none;border-radius:14px;font-size:16px;font-weight:bold;font-family:Georgia,serif;cursor:pointer;letter-spacing:.5px;}

  .cabecera{padding:16px 20px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--verde-oscuro);z-index:1000;}
  .cab-titulo{color:var(--crema);font-size:14px;font-style:italic;}
  .estado{background:var(--oro);color:var(--verde-oscuro);border-radius:12px;padding:3px 12px;font-size:12px;font-weight:bold;}
  #mapa{flex:1;width:100%;background:var(--verde);}
  .portal-icono{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(200,168,75,.35);color:var(--verde-oscuro);font-size:14px;border:2px solid rgba(245,239,224,.4);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .3s,box-shadow .3s,background .3s;}
  .portal-icono.objetivo{background:var(--oro);border-color:var(--crema);}
  .portal-icono.cerca{background:var(--oro-vivo);transform:scale(1.4);box-shadow:0 0 0 6px rgba(244,211,94,.35),0 0 18px rgba(244,211,94,.9);}
  .usuario-punto{width:16px;height:16px;border-radius:50%;background:#5BBFFF;border:3px solid #fff;box-shadow:0 0 10px rgba(91,191,255,.9);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;}
  .usuario-pulso{width:16px;height:16px;border-radius:50%;background:rgba(91,191,255,.4);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:pulso 2s infinite;}
  @keyframes pulso{0%{transform:translate(-50%,-50%) scale(1);opacity:.8;}100%{transform:translate(-50%,-50%) scale(4);opacity:0;}}
  .instruccion{color:rgba(245,239,224,.55);font-size:12px;text-align:center;padding:8px 16px 4px;font-style:italic;background:var(--verde-oscuro);}
  .aviso{margin:6px 14px 14px;padding:14px 18px;background:var(--oro);border-radius:16px;display:flex;align-items:center;gap:12px;animation:aparecer .4s ease;}
  .aviso-label{font-size:11px;color:var(--verde-oscuro);text-transform:uppercase;letter-spacing:1px;opacity:.7;}
  .aviso-nombre{font-size:15px;color:var(--verde-oscuro);font-weight:bold;margin:2px 0;}
  .aviso-dist{font-size:12px;color:var(--verde-oscuro);opacity:.7;}
  .aviso-btn{padding:12px 22px;background:var(--verde-oscuro);color:var(--oro-vivo);border:none;border-radius:12px;font-size:15px;font-weight:bold;font-family:Georgia,serif;cursor:pointer;}
  .aviso-vacio{margin:6px 14px 14px;padding:14px;background:rgba(245,239,224,.06);border-radius:16px;color:rgba(245,239,224,.5);font-size:13px;text-align:center;font-style:italic;border:1px dashed rgba(244,211,94,.2);}
  @keyframes aparecer{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .control-fila{display:flex;gap:8px;padding:0 14px 14px;background:var(--verde-oscuro);}
  .btn-gps{flex:1;padding:11px;border-radius:10px;font-family:Georgia,serif;font-size:13px;cursor:pointer;border:1px solid var(--oro);background:transparent;color:var(--oro);}
  .btn-gps.activo{background:var(--oro);color:var(--verde-oscuro);font-weight:bold;}

  #pantalla-nodo{background:radial-gradient(circle at 50% 0%,var(--verde) 0%,var(--verde-oscuro) 60%);overflow-y:auto;padding:28px 24px;}
  .n-icono{font-size:32px;color:var(--oro-vivo);text-align:center;text-shadow:0 0 16px rgba(244,211,94,.6);}
  .n-lugar{color:var(--oro);font-size:13px;text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin:8px 0 4px;}
  .texto-box{background:rgba(0,0,0,.25);border-left:3px solid var(--oro);border-radius:0 12px 12px 0;padding:16px 18px;margin-bottom:16px;}
  .texto-cabecera{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .texto-label{color:var(--oro);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;}
  .btn-oir{background:none;border:1px solid var(--oro);color:var(--oro);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:Georgia,serif;transition:background .2s,color .2s,box-shadow .2s;}
  .btn-oir:active{background:var(--oro);color:var(--verde-oscuro);}
  .btn-oir.hablando{background:var(--oro-vivo);color:var(--verde-oscuro);box-shadow:0 0 10px rgba(244,211,94,.8);}
  .texto-cuerpo{color:var(--crema);font-size:18px;line-height:1.65;}
  .cargando{color:rgba(245,239,224,.6);font-size:14px;font-style:italic;text-align:center;padding:20px;}
  .error-box{margin-top:12px;padding:14px;background:rgba(200,80,60,.15);border:1px dashed rgba(200,80,60,.5);border-radius:12px;color:#f0c9c0;font-size:13px;text-align:center;}
  .ok-box{margin-top:20px;padding:14px;background:rgba(244,211,94,.12);border:1px dashed rgba(244,211,94,.4);border-radius:12px;color:var(--oro-vivo);font-size:13px;text-align:center;font-style:italic;}
  .btn-volver{width:100%;padding:14px;background:transparent;color:var(--oro);border:1px solid var(--oro);border-radius:12px;font-size:15px;font-family:Georgia,serif;cursor:pointer;margin-top:20px;}

  .voz-box{margin-top:10px;padding-top:18px;border-top:1px dashed rgba(244,211,94,.3);}
  .voz-titulo{color:var(--oro);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-bottom:12px;}
  .btn-mic{width:100%;padding:18px;background:var(--oro);color:var(--verde-oscuro);border:none;border-radius:14px;font-size:16px;font-weight:bold;font-family:Georgia,serif;cursor:pointer;margin-bottom:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .btn-mic:active{background:var(--oro-vivo);}
  #estado-voz{color:rgba(245,239,224,.8);font-size:13px;text-align:center;min-height:18px;margin-bottom:16px;font-style:italic;}
  .nombres-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-nombre{padding:11px;background:transparent;border:1px solid var(--oro);border-radius:10px;color:var(--oro);font-family:Georgia,serif;font-size:13px;cursor:pointer;}
  .btn-nombre:active{background:var(--oro);color:var(--verde-oscuro);}
  .btn-mic:disabled, .btn-nombre:disabled{opacity:.35;cursor:not-allowed;}
  .btn-volver:disabled{opacity:.3;cursor:not-allowed;}
  .opciones-grid{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .btn-opcion{padding:13px;background:transparent;border:1px solid var(--oro);border-radius:10px;color:var(--oro);font-family:Georgia,serif;font-size:14px;cursor:pointer;}
  .btn-opcion:active{background:var(--oro);color:var(--verde-oscuro);}
  .btn-opcion:disabled{opacity:.35;cursor:not-allowed;}

  .btn-toggle-mapa{position:absolute;top:64px;right:16px;z-index:1500;padding:11px 18px;background:var(--oro);color:var(--verde-oscuro);border:none;border-radius:24px;font-family:Georgia,serif;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:220px;}
  .btn-toggle-mapa[hidden]{display:none;}
</style>
</head>
<body>
<div id="app"><div id="movil">

  <div id="bienvenida" class="pantalla activa">
    <div class="hada">✦</div>
    <h1>El Orbe Activo</h1>
    <p class="subt">Prototipo — Hito 7: Misións 2 e 3</p>
    <p class="intro" id="estado-conexion">Conectando con el resonador...</p>
    <button class="btn-grande" id="btn-empezar" onclick="irAMapa()" disabled>Empezar la prueba</button>
    <button class="btn-gps" style="margin-top:12px;width:100%" onclick="reiniciarSesion()">🔄 Reiniciar sesión (empezar de cero)</button>
  </div>

  <div id="pantalla-mapa" class="pantalla">
    <div class="cabecera">
      <span class="cab-titulo">Prueba de cuatro nodos</span>
      <span class="estado" id="estado-txt">—</span>
    </div>
    <div id="mapa"></div>
    <p class="instruccion" id="instruccion">Toca el mapa para moverte — simula caminar por la ciudad</p>
    <div id="zona-aviso"></div>
    <div class="control-fila">
      <button class="btn-gps activo" id="btn-sim" onclick="modoSimulado()">✦ Modo simulación</button>
      <button class="btn-gps" id="btn-gps" onclick="modoGPSReal()">◉ GPS real (en el móvil)</button>
    </div>
  </div>

  <div id="pantalla-nodo" class="pantalla">
    <div class="n-icono">✦</div>
    <div id="n-contenido">
      <p class="cargando">Abrindo o canal co resonador...</p>
    </div>
    <button class="btn-volver" id="btn-volver" onclick="volverAlMapa()">← Volver al mapa</button>
  </div>

  <button class="btn-toggle-mapa" id="btn-toggle-mapa" onclick="alternarMapaWaypoint()" hidden>🗺️ Ver mapa</button>

</div></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  HITO 7 — cuatro nodos reales: Campillo, Prateria (M1),           ║
// ║  Enfesta de San Telmo (M2) y Praza do Peirao (M3). El mapa        ║
// ║  ilumina en dorado el nodo al que le toca ir al jugador según     ║
// ║  su etapa actual (consultada en /estado); el resto del             ║
// ║  contenido y las acciones se piden a /nodo-activo y /accion.       ║
// ║  Novedad: algunos bloques de narración llevan "mapaDurante" (un     ║
// ║  punto intermedio, p. ej. as Cinco Calles). Mientras suenan, aparece ║
// ║  un botón flotante "Ver mapa" para quien quiera orientarse; el       ║
// ║  texto se queda a la vista por defecto, para quien prefiera leerlo.  ║
// ║  Si el jugador abrió el mapa con ese botón, se vuelve solo al texto  ║
// ║  en cuanto la frase termina, para no perderse lo que venga después.  ║
// ╚══════════════════════════════════════════════════════════════╝
const WORKER = "https://orbe-activo-hito1.galicianrunner.workers.dev";

const NODOS = {
  campillo: { key: "campillo", nombre: "Campillo de Santa María", lat: 42.434118, lng: -8.647704 },
  prateria: { key: "prateria", nombre: "Praza da Prateria Vella", lat: 42.434285, lng: -8.646736 },
  enfesta: { key: "enfesta", nombre: "Enfesta de San Telmo", lat: 42.434521, lng: -8.646264 },
  peirao: { key: "peirao", nombre: "Praza do Peirao", lat: 42.434827, lng: -8.645607 }
};
const OBJETIVO_POR_MISION = {
  presentacion: "campillo",
  resonador: "campillo",
  camino_m1: "prateria",
  camino_m2: "enfesta",
  m2_transito: "peirao",
  m3_trampa: "peirao",
  m3_final: "peirao"
};

const RADIO = 30;
const CENTRO = [42.4335, -8.6470];

let mapa, usuarioMarker, marcadores = {};
let posicion = { lat: 42.4330, lng: -8.6475 };
let modoGPS = false, watchId = null;
let resonadorId = null;
let misionActual = "presentacion";
let mediaRecorder = null, trozosAudio = [];
let accionActual = null; // { tipo, ... } de la etapa que se está mostrando ahora mismo
let opcionesActuales = []; // opciones (botón + palabras clave) del paso de micrófono actual, si las hay
let nodoAbierto = null; // qué nodo físico está abierto en pantalla ahora mismo
let autoAbiertoPara = null; // "mision|nodo" ya abierto en automático, para no repetirlo en bucle
let vocesPendientes = 0; // cuántas frases quedan por sonar del nodo actual
let autoAperturaPendiente = null; // "mision|nodo" esperando a que calle la voz para abrirse solo
let bloquesInicialesPendientes = 0; // cuántos bloques de la narración propia de este nodo (la que suena al abrirlo) faltan por terminar
let esPantallaFinal = false; // true solo en la pantalla de "Hito superado", para no volver sola al mapa ahí
let rutaLinea = null, rutaFlecha = null; // capas del mapa: línea de puntos + flecha hacia el próximo nodo
let waypointDisponible = null; // {lat,lng,nombre} mientras suena un bloque con "mapaDurante": el botón de alternar mapa/texto aparece
let viendoMapaWaypoint = false; // true cuando el jugador, con el botón, decidió ver el mapa en vez del texto durante ese bloque

function quitarAcentos(s){
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function elegirVoz(){
  if (!('speechSynthesis' in window)) return null;
  const voces = speechSynthesis.getVoices();
  const prefijos = ['gl', 'pt', 'es'];
  for (const p of prefijos){
    const v = voces.find(v => v.lang.toLowerCase().startsWith(p));
    if (v) return v;
  }
  return voces[0] || null;
}
// Se llama cada vez que termina (o falla) una frase. Cuando ya no queda
// ninguna voz sonando, comprueba si había una apertura automática en
// espera (porque llegamos a un nodo nuevo mientras aún hablaba el
// anterior) y, si seguimos dentro del radio de ese nodo, la dispara ahora.
function vozTerminada(){
  vocesPendientes = Math.max(0, vocesPendientes - 1);
  if (vocesPendientes > 0 || !autoAperturaPendiente || nodoAbierto !== null) return;
  const combo = autoAperturaPendiente;
  autoAperturaPendiente = null;
  const [misionCombo, nodoCombo] = combo.split('|');
  if (misionCombo !== misionActual) return; // la etapa cambió mientras esperábamos
  const n = NODOS[nodoCombo];
  if (!n) return;
  const d = distancia(posicion.lat, posicion.lng, n.lat, n.lng);
  if (d <= RADIO){
    autoAbiertoPara = combo;
    abrirNodo(nodoCombo);
  }
}
// Mientras suenan los bloques propios de un nodo recién abierto, el botón
// de micrófono (y los de escoller nome) están desactivados: así el
// xogador non pode falar ou escoller antes de escoitar o que ten que dicir.
// Esta función se avisa cando remata cada bloque "inicial" (ver
// encolarHabla, parámetro esInicial) e, en canto non queda ningún, activa
// os controis.
function marcarBloqueInicialTerminado(){
  bloquesInicialesPendientes = Math.max(0, bloquesInicialesPendientes - 1);
  if (bloquesInicialesPendientes === 0) habilitarAccion(true);
}
// autoVolver=true solo cuando la narración terminó ela misma, de forma
// natural (nunca cuando se interrumpió a mano con "Repetir": en ese caso
// solo queremos desbloquear os controis, non saír da pantalla).
function habilitarAccion(autoVolver){
  const btnVolver = document.getElementById('btn-volver');
  if (btnVolver) btnVolver.disabled = false;
  const caja = document.getElementById('voz-box');
  if (caja){
    caja.classList.remove('voz-bloqueada');
    caja.querySelectorAll('button').forEach(b => { b.disabled = false; });
    if (accionActual && accionActual.tipo === 'nombre'){
      const ev = document.getElementById('estado-voz');
      if (ev) ev.textContent = 'Ou toca un dos nomes:';
    } else {
      const ev = document.getElementById('estado-voz');
      if (ev && ev.textContent.indexOf('Escoita') === 0) ev.textContent = '';
    }
  }
  // Si este nodo non pedía ningunha acción (é un tránsito puro, sen
  // micrófono nin nomes) e a narración rematou soa, non hai nada que
  // facer aquí: volvemos ao mapa sen que o xogador teña que tocar nada,
  // para que siga camiñando cara ao seguinte punto. A pantalla final de
  // "Hito superado" queda fóra desta regra a propósito.
  if (autoVolver && !accionActual && !esPantallaFinal){
    volverAlMapa();
  }
}
// mapaDurante (opcional): {lat,lng,nombre} de un punto intermedio. Si se
// pasa, mientras ESTA frase concreta suena aparece un botón flotante
// ("Ver mapa") para que quien quiera vea la ruta hacia ese punto, sin
// obligar a nadie: el texto se queda a la vista por defecto para quien
// prefiera leerlo mientras escucha. Si el jugador llega a abrir el mapa
// con ese botón y la frase termina, se vuelve solo al texto (para no
// perderse lo que venga después, como los botones de decisión).
function encolarHabla(texto, botonId, esInicial, mapaDurante){
  if (!texto || !('speechSynthesis' in window)){
    if (esInicial) marcarBloqueInicialTerminado();
    return;
  }
  try{
    const utter = new SpeechSynthesisUtterance(texto);
    const voz = elegirVoz();
    if (voz){ utter.voice = voz; utter.lang = voz.lang; }
    else { utter.lang = 'es-ES'; }
    utter.rate = 0.95;
    vocesPendientes++;
    utter.onstart = () => {
      if (botonId){ const b = document.getElementById(botonId); if (b) b.classList.add('hablando'); }
      if (mapaDurante){ waypointDisponible = mapaDurante; actualizarBotonToggle(); }
    };
    utter.onend   = () => {
      if (botonId){ const b = document.getElementById(botonId); if (b) b.classList.remove('hablando'); }
      if (mapaDurante){
        waypointDisponible = null;
        if (viendoMapaWaypoint) volverATextoWaypoint(); else actualizarBotonToggle();
      }
      vozTerminada(); if (esInicial) marcarBloqueInicialTerminado();
    };
    utter.onerror = () => {
      if (botonId){ const b = document.getElementById(botonId); if (b) b.classList.remove('hablando'); }
      if (mapaDurante){
        waypointDisponible = null;
        if (viendoMapaWaypoint) volverATextoWaypoint(); else actualizarBotonToggle();
      }
      vozTerminada(); if (esInicial) marcarBloqueInicialTerminado();
    };
    speechSynthesis.speak(utter);
  }catch(e){
    vozTerminada();
    if (esInicial) marcarBloqueInicialTerminado();
  }
}
function hablar(texto, botonId){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  vocesPendientes = 0;
  // Si alguien pulsa "Repetir" mientras aún esperábamos a que acabase la
  // narración inicial del nodo, esa espera ya no se puede completar de
  // forma natural (acabamos de cortarla). Para no dejar los controis
  // bloqueados para sempre, liberámolos xa.
  if (bloquesInicialesPendientes > 0){
    bloquesInicialesPendientes = 0;
    habilitarAccion(false);
  }
  // Al repetir a mano no reactivamos el botón de mapa —así no hay
  // sorpresas si se pulsa "Repetir" estando ya de vuelta en el nodo.
  encolarHabla(texto, botonId, false, null);
}

// Botón flotante que alterna entre la pantalla de texto y la de mapa
// mientras hay un punto intermedio disponible (waypointDisponible). El
// jugador decide: por defecto se queda en el texto, y solo ve el mapa si
// lo pide.
function actualizarBotonToggle(){
  const b = document.getElementById('btn-toggle-mapa');
  if (!b) return;
  if (!waypointDisponible){ b.hidden = true; return; }
  b.hidden = false;
  b.textContent = viendoMapaWaypoint ? '📜 Ver texto' : ('🗺️ Ver mapa cara a ' + waypointDisponible.nombre);
}
function mostrarMapaWaypoint(){
  if (!waypointDisponible || !mapa) return;
  viendoMapaWaypoint = true;
  document.getElementById('pantalla-nodo').classList.remove('activa');
  document.getElementById('pantalla-mapa').classList.add('activa');
  document.getElementById('instruccion').textContent = 'Vas cara a ' + waypointDisponible.nombre + '...';
  document.getElementById('zona-aviso').innerHTML = '<div class="aviso-vacio">Segue escoitando... vas cara a ' + waypointDisponible.nombre + '</div>';
  setTimeout(()=>{ if(mapa) mapa.invalidateSize(); dibujarRuta(waypointDisponible); }, 150);
  actualizarBotonToggle();
}
function volverATextoWaypoint(){
  viendoMapaWaypoint = false;
  document.getElementById('pantalla-mapa').classList.remove('activa');
  document.getElementById('pantalla-nodo').classList.add('activa');
  const instr = document.getElementById('instruccion');
  if (instr) instr.textContent = modoGPS ? 'Usando tu GPS real — camina por la ciudad' : 'Toca el mapa para moverte — simula caminar por la ciudad';
  actualizarBotonToggle();
}
function alternarMapaWaypoint(){
  if (viendoMapaWaypoint) volverATextoWaypoint(); else mostrarMapaWaypoint();
}

function guardarId(id){ try{ localStorage.setItem('orbe_resonador_id', id); }catch(e){} }
function leerIdGuardado(){ try{ return localStorage.getItem('orbe_resonador_id'); }catch(e){ return null; } }
function reiniciarSesion(){
  try{ localStorage.removeItem('orbe_resonador_id'); }catch(e){}
  location.reload();
}

async function iniciarSesion(){
  const guardado = leerIdGuardado();
  if (guardado){
    resonadorId = guardado;
    document.getElementById('estado-conexion').textContent = 'Canal reconocido. Listo para continuar.';
    document.getElementById('btn-empezar').disabled = false;
    return;
  }
  try{
    const r = await fetch(WORKER + '/sesion');
    const d = await r.json();
    resonadorId = d.resonador_id;
    guardarId(resonadorId);
    document.getElementById('estado-conexion').textContent = 'Canal abierto. Listo para empezar.';
    document.getElementById('btn-empezar').disabled = false;
  }catch(e){
    document.getElementById('estado-conexion').textContent = 'Non se puido conectar co resonador. Comproba a túa conexión e recarga a páxina.';
  }
}

async function consultarEstado(){
  try{
    const r = await fetch(WORKER + '/estado?id=' + encodeURIComponent(resonadorId));
    const d = await r.json();
    misionActual = d.mision || 'presentacion';
  }catch(e){ /* si falla, se queda con la última etapa conocida */ }
}

function distancia(la1,ln1,la2,ln2){
  const R=6371000,tR=d=>d*Math.PI/180;
  const dLa=tR(la2-la1),dLn=tR(ln2-ln1);
  const a=Math.sin(dLa/2)**2+Math.cos(tR(la1))*Math.cos(tR(la2))*Math.sin(dLn/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function cargarLeaflet(cb){
  if(window.L){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  s.onload=()=>cb();
  s.onerror=()=>{document.getElementById('mapa').innerHTML='<p style="color:#F5EFE0;padding:30px;text-align:center;font-style:italic">No se pudo cargar el mapa.</p>';};
  document.head.appendChild(s);
}

async function irAMapa(){
  document.getElementById('bienvenida').classList.remove('activa');
  document.getElementById('pantalla-mapa').classList.add('activa');
  await consultarEstado();
  if(!mapa) cargarLeaflet(()=>setTimeout(initMapa,150));
  else { setTimeout(()=>{ mapa.invalidateSize(); },200); actualizar(); }
}

function initMapa(){
  mapa=L.map('mapa',{zoomControl:true,attributionControl:false}).setView(CENTRO,17);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd'}).addTo(mapa);

  Object.values(NODOS).forEach(n => {
    const icon=L.divIcon({className:'',html:'<div class="portal-icono" id="pico-'+n.key+'">✦</div>',iconSize:[28,28],iconAnchor:[14,14]});
    const marker=L.marker([n.lat,n.lng],{icon}).addTo(mapa);
    marker.on('click',()=>intentarAbrir(n.key));
    marcadores[n.key]=marker;
  });

  const uicon=L.divIcon({className:'',html:'<div class="usuario-icono"><div class="usuario-pulso"></div><div class="usuario-punto"></div></div>',iconSize:[16,16],iconAnchor:[8,8]});
  usuarioMarker=L.marker([posicion.lat,posicion.lng],{icon:uicon,zIndexOffset:1000}).addTo(mapa);

  mapa.on('click',e=>{ if(!modoGPS){ posicion={lat:e.latlng.lat,lng:e.latlng.lng}; actualizar(); }});
  actualizar();
}

// Rumbo (0º = norte, sentido horario) desde un punto a otro — para
// orientar la flecha de la ruta hacia el próximo nodo.
function calcularRumbo(la1,ln1,la2,ln2){
  const toRad = g => g*Math.PI/180, toDeg = r => r*180/Math.PI;
  const f1=toRad(la1), f2=toRad(la2), dL=toRad(ln2-ln1);
  const y = Math.sin(dL)*Math.cos(f2);
  const x = Math.cos(f1)*Math.sin(f2) - Math.sin(f1)*Math.cos(f2)*Math.cos(dL);
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

// Dibuja (y redibuja en cada actualización de posición) una línea de
// puntos roja desde donde está el jugador hasta el próximo nodo, con una
// pequeña flecha en el extremo señalando el punto exacto. Es una línea
// recta (no sigue las calles), pensada solo como referencia visual de
// hacia dónde tirar.
function dibujarRuta(objetivo){
  if (!mapa) return;
  const desde = [posicion.lat, posicion.lng];
  const hasta = [objetivo.lat, objetivo.lng];
  if (rutaLinea) mapa.removeLayer(rutaLinea);
  rutaLinea = L.polyline([desde, hasta], { color:'#D94F3D', weight:3, opacity:.85, dashArray:'2,10', lineCap:'round' }).addTo(mapa);

  const rumbo = calcularRumbo(posicion.lat, posicion.lng, objetivo.lat, objetivo.lng);
  if (rutaFlecha) mapa.removeLayer(rutaFlecha);
  const icono = L.divIcon({
    className:'',
    html:'<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid #D94F3D;transform:rotate('+rumbo+'deg);transform-origin:50% 65%;filter:drop-shadow(0 0 2px rgba(0,0,0,.6));"></div>',
    iconSize:[13,13], iconAnchor:[6,6]
  });
  rutaFlecha = L.marker(hasta, { icon: icono, interactive:false, zIndexOffset:400 }).addTo(mapa);
}

function actualizar(){
  if(usuarioMarker) usuarioMarker.setLatLng([posicion.lat,posicion.lng]);

  // Mientras el jugador está viendo el mapa del punto intermedio (lo pidió
  // con el botón flotante), no tocamos nada de la lógica normal de nodos:
  // solo movemos o xogador e redebuxamos a ruta cara a ese punto. Cando
  // volva ao texto (a man ou porque a frase remate), actualizar() segue
  // funcionando coma sempre.
  if (viendoMapaWaypoint){
    dibujarRuta(waypointDisponible);
    return;
  }

  const objetivoKey = OBJETIVO_POR_MISION[misionActual] || 'campillo';

  Object.values(NODOS).forEach(n => {
    const d = distancia(posicion.lat,posicion.lng,n.lat,n.lng);
    const el = document.getElementById('pico-'+n.key);
    if (el){
      el.classList.toggle('objetivo', n.key === objetivoKey);
      el.classList.toggle('cerca', d<=RADIO);
    }
  });

  const objetivo = NODOS[objetivoKey];
  const dObjetivo = distancia(posicion.lat,posicion.lng,objetivo.lat,objetivo.lng);

  // Apertura automática: si entras en el radio del nodo que te toca (y no
  // estás ya dentro de un nodo), se abre solo, sin que tengas que pulsar
  // "Abrir". Solo se dispara UNA VEZ por etapa (guardado en autoAbiertoPara)
  // para no reabrirse en bucle si te quedas parado ahí o vuelves al mapa
  // por tu cuenta. Y si todavía está sonando la narración del nodo
  // anterior (p. ej. el tránsito, que es largo y puede que aún no haya
  // terminado cuando llegas caminando), NO la cortamos: se deja marcada
  // como pendiente y se abrirá sola en cuanto esa voz calle (ver
  // vozTerminada). Mientras tanto, el botón "Abrir" del aviso sigue
  // disponible por si el jugador prefiere adelantarse.
  if (dObjetivo <= RADIO && nodoAbierto === null){
    const combo = misionActual + '|' + objetivoKey;
    if (autoAbiertoPara !== combo){
      if (vocesPendientes > 0){
        autoAperturaPendiente = combo;
      } else {
        autoAbiertoPara = combo;
        abrirNodo(objetivoKey);
        return;
      }
    }
  }

  dibujarRuta(objetivo);
  pintarAviso(dObjetivo<=RADIO ? Math.round(dObjetivo) : null, objetivo);
}

// Mientras la narración de llegada a un nodo está pendiente de sonar (o
// sonando), no se ofrece forma de adelantarse: ni botón "Abrir" en el
// aviso, ni marcador tocable en el mapa. Así nunca se pierde historia.
function esperandoNarracionDe(nodoKey){
  return vocesPendientes > 0 && autoAperturaPendiente === (misionActual + '|' + nodoKey);
}

function pintarAviso(dist, objetivo){
  const z=document.getElementById('zona-aviso');
  if(dist!==null){
    if (esperandoNarracionDe(objetivo.key)){
      z.innerHTML='<div class="aviso"><div style="flex:1"><p class="aviso-label">Chegaches a</p><p class="aviso-nombre">'+objetivo.nombre+'</p><p class="aviso-dist">Agarda un intre... está a rematar de falar</p></div></div>';
    } else {
      z.innerHTML='<div class="aviso"><div style="flex:1"><p class="aviso-label">Estás cerca do teu próximo punto</p><p class="aviso-nombre">'+objetivo.nombre+'</p><p class="aviso-dist">a '+dist+' metros</p></div><button class="aviso-btn" onclick="intentarAbrir(\''+objetivo.key+'\')">Abrir</button></div>';
    }
  } else {
    z.innerHTML='<div class="aviso-vacio">Diríxete a '+objetivo.nombre+' (o dourado no mapa)</div>';
  }
}

function intentarAbrir(nodoKey){
  if (viendoMapaWaypoint) return; // no interrumpir mientras se está mirando el mapa del punto intermedio
  if (esperandoNarracionDe(nodoKey)){
    const z=document.getElementById('zona-aviso');
    z.innerHTML='<div class="aviso-vacio">Agarda un intre... está a rematar de falar</div>';
    return;
  }
  const objetivoKey = OBJETIVO_POR_MISION[misionActual] || 'campillo';
  const n = NODOS[nodoKey];
  const d = distancia(posicion.lat,posicion.lng,n.lat,n.lng);
  if (d > RADIO){
    flashLejos(Math.round(d), n);
    return;
  }
  if (nodoKey !== objetivoKey){
    const z=document.getElementById('zona-aviso');
    z.innerHTML='<div class="aviso-vacio">Aínda non tes nada que facer aquí. Diríxete a '+NODOS[objetivoKey].nombre+'.</div>';
    setTimeout(actualizar,2500);
    return;
  }
  abrirNodo(nodoKey);
}

function flashLejos(d, n){
  const z=document.getElementById('zona-aviso');
  z.innerHTML='<div class="aviso-vacio">Estás a '+d+' m de '+n.nombre+'. Acércate a menos de '+RADIO+' m.</div>';
  setTimeout(actualizar,2200);
}

async function abrirNodo(nodoKey){
  nodoAbierto = nodoKey;
  document.getElementById('estado-txt').textContent = NODOS[nodoKey].nombre;
  document.getElementById('pantalla-mapa').classList.remove('activa');
  document.getElementById('pantalla-nodo').classList.add('activa');
  document.getElementById('pantalla-nodo').scrollTop=0;
  const cont = document.getElementById('n-contenido');
  cont.innerHTML = '<p class="cargando">Abrindo o canal co resonador...</p>';
  accionActual = null;
  esPantallaFinal = false;
  opcionesActuales = [];
  waypointDisponible = null;
  viendoMapaWaypoint = false;
  actualizarBotonToggle();

  try{
    const r = await fetch(WORKER + '/nodo-activo?id=' + encodeURIComponent(resonadorId) + '&nodo=' + encodeURIComponent(nodoKey));
    const d = await r.json();
    if (d.error){
      cont.innerHTML = '<div class="error-box">O Worker respondeu cun erro: ' + escapar(d.error) + '</div>';
      return;
    }

    let html = '<p class="n-lugar">' + escapar(d.nodo.nombre) + '</p>';
    (d.bloques || []).forEach((b, i) => {
      const botonId = 'btn-oir-' + i;
      html += '<div class="texto-box"><div class="texto-cabecera"><p class="texto-label">' + escapar(b.label) + '</p>' +
        '<button class="btn-oir" id="' + botonId + '" onclick="hablar(this.dataset.texto,\'' + botonId + '\')" data-texto="' + escapar(b.texto) + '">🔊 Repetir</button></div>' +
        '<p class="texto-cuerpo">' + escapar(b.texto) + '</p></div>';
    });

    // Mientras los bloques de texto de este nodo aún no han terminado de
    // sonar, el micrófono y los nombres se muestran desactivados: primero
    // se escucha, luego se actúa. En cuanto acaban (marcarBloqueInicialTerminado
    // llega a 0), habilitarAccion() los activa solo, sin recargar nada.
    const bloqueado = (d.bloques || []).length > 0;
    if (d.accion && d.accion.tipo === 'nombre'){
      const todos = [...d.accion.nombres.mujer, ...d.accion.nombres.hombre];
      html += '<div class="voz-box' + (bloqueado ? ' voz-bloqueada' : '') + '" id="voz-box">' +
        '<p class="voz-titulo">Escolle o teu nome</p>' +
        '<button class="btn-mic" id="btn-mic"' + (bloqueado ? ' disabled' : '') +
          ' onmousedown="empezarGrabacion()" onmouseup="pararGrabacion()"' +
          ' ontouchstart="event.preventDefault();empezarGrabacion()" ontouchend="event.preventDefault();pararGrabacion()"' +
          '>🎙️ Mantén pulsado e di un nome</button>' +
        '<p id="estado-voz">' + (bloqueado ? 'Escoita até o final...' : 'Ou toca un dos nomes:') + '</p>' +
        '<div class="nombres-grid">' +
          todos.map(n => '<button class="btn-nombre"' + (bloqueado ? ' disabled' : '') + ' onclick="ejecutarAccion(\'nombre\',\'' + n + '\')">' + n + '</button>').join('') +
        '</div>' +
      '</div>';
      accionActual = { tipo: 'nombre' };
    } else if (d.accion && d.accion.tipo === 'mic'){
      const opciones = d.accion.opciones || [];
      opcionesActuales = opciones;
      html += '<div class="voz-box' + (bloqueado ? ' voz-bloqueada' : '') + '" id="voz-box">' +
        (d.accion.instruccion ? '<p class="voz-titulo">' + escapar(d.accion.instruccion) + '</p>' : '') +
        '<button class="btn-mic" id="btn-mic"' + (bloqueado ? ' disabled' : '') +
          ' onmousedown="empezarGrabacion()" onmouseup="pararGrabacion()"' +
          ' ontouchstart="event.preventDefault();empezarGrabacion()" ontouchend="event.preventDefault();pararGrabacion()"' +
          '>🎙️ Mantén pulsado e fala</button>' +
        '<p id="estado-voz">' + (bloqueado ? 'Escoita até o final...' : '') + '</p>' +
        (opciones.length ? '<div class="opciones-grid">' +
          opciones.map(op => '<button class="btn-opcion"' + (bloqueado ? ' disabled' : '') + ' onclick="ejecutarAccion(\'mic\',\'' + op.valor + '\')">' + escapar(op.etiqueta) + '</button>').join('') +
        '</div>' : '') +
      '</div>';
      accionActual = { tipo: 'mic' };
    } else if (d.final){
      html += '<div class="ok-box">Hito 7 superado: Misións 2 e 3 completadas (Xudería e Praza do Peirao) co guion real.</div>';
      esPantallaFinal = true;
    }

    cont.innerHTML = html;

    // Mientras habla el propio nodo, tampoco se puede escapar hacia el mapa:
    // así no hay ningún atajo (ni micrófono, ni nombres, ni "Volver al
    // mapa") que permita perderse la narración que se acaba de abrir.
    const btnVolver = document.getElementById('btn-volver');
    if (btnVolver) btnVolver.disabled = bloqueado;

    speechSynthesis.cancel();
    vocesPendientes = 0;
    autoAperturaPendiente = null; // este nodo ya se abrió; cualquier espera anterior queda obsoleta
    bloquesInicialesPendientes = (d.bloques || []).length;
    (d.bloques || []).forEach((b, i) => encolarHabla(b.texto, 'btn-oir-' + i, true, b.mapaDurante || null));
  }catch(e){
    cont.innerHTML = '<div class="error-box">Non se puido contactar co Worker. Comproba a túa conexión e inténtao de novo.</div>';
  }
}

async function empezarGrabacion(){
  const estadoVoz = document.getElementById('estado-voz');
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    trozosAudio = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => trozosAudio.push(e.data);
    mediaRecorder.onstop = procesarAudioGrabado;
    mediaRecorder.start();
    if (estadoVoz) estadoVoz.textContent = 'Escoitando...';
  }catch(e){
    if (estadoVoz) estadoVoz.textContent = 'Non se puido acceder ao micrófono: ' + e.message;
  }
}
function pararGrabacion(){
  if (mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
}

async function procesarAudioGrabado(){
  const estadoVoz = document.getElementById('estado-voz');
  if (estadoVoz) estadoVoz.textContent = 'Procesando...';
  const blob = new Blob(trozosAudio, { type: 'audio/webm' });
  const datos = new FormData();
  datos.append('audio', blob, 'grabacion.webm');
  try{
    const r = await fetch(WORKER + '/escucha', { method: 'POST', body: datos });
    const j = await r.json();
    if (j.error){
      if (estadoVoz) estadoVoz.textContent = 'Erro: ' + j.error;
      return;
    }
    if (accionActual && accionActual.tipo === 'nombre'){
      if (j.nombre_reconocido){
        if (estadoVoz) estadoVoz.textContent = 'Entendín: ' + j.nombre_reconocido + '...';
        await ejecutarAccion('nombre', j.nombre_reconocido);
      } else {
        if (estadoVoz) estadoVoz.textContent = 'Non recoñecín ningún nome' + (j.texto_oido ? ' ("' + j.texto_oido + '")' : '') + '. Proba outra vez ou toca un nome.';
      }
    } else {
      // Acción de micrófono con opciones: no basta con que se oiga
      // cualquier cosa — tiene que reconocerse alguna de las palabras
      // clave de alguna opción (p. ej. "Saúl" o "porto"). Si no se
      // reconoce ninguna, no se avanza solo; se avisa de que toque el
      // botón de la opción a mano.
      const textoOido = j.texto_oido || '';
      if (opcionesActuales.length > 0){
        const normalizado = quitarAcentos(textoOido.toLowerCase());
        const opcion = opcionesActuales.find(op =>
          (op.palabrasClave || []).some(clave => normalizado.includes(quitarAcentos(String(clave).toLowerCase())))
        );
        if (opcion){
          if (estadoVoz) estadoVoz.textContent = 'Recibido: "' + textoOido + '"';
          await ejecutarAccion('mic', opcion.valor);
        } else {
          if (estadoVoz) estadoVoz.textContent = 'O teu resonador non se recibe con claridade. Pulsa o botón da opción para continuar.';
        }
      } else if (textoOido.trim().length > 0){
        if (estadoVoz) estadoVoz.textContent = 'Recibido: "' + textoOido + '"';
        await ejecutarAccion('mic', textoOido);
      } else {
        if (estadoVoz) estadoVoz.textContent = 'Non se detectou ningunha voz. Proba outra vez.';
      }
    }
  }catch(e){
    if (estadoVoz) estadoVoz.textContent = 'Fallou o envío do audio: ' + e.message;
  }
}

async function ejecutarAccion(tipo, valor){
  try{
    const r = await fetch(WORKER + '/accion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resonador_id: resonadorId, tipo, valor })
    });
    const j = await r.json();
    if (j.error){
      alert('Non se puido rexistrar a acción: ' + j.error);
      return;
    }
    misionActual = j.estado.mision;
    // Siempre nos quedamos en el mismo nodo mostrando lo que toca a
    // continuación (aunque el próximo objetivo esté en otro sitio):
    // así nunca nos saltamos texto del guion. El jugador vuelve al
    // mapa él mismo, con el botón "Volver al mapa", cuando ya leyó/oyó
    // todo y le toca caminar a otro nodo.
    if (nodoAbierto){
      abrirNodo(nodoAbierto);
    } else {
      volverAlMapa();
    }
  }catch(e){
    alert('Fallou o rexistro da acción. Comproba a conexión.');
  }
}

function escapar(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

async function volverAlMapa(){
  speechSynthesis.cancel();
  vocesPendientes = 0;
  nodoAbierto = null;
  document.getElementById('pantalla-nodo').classList.remove('activa');
  document.getElementById('pantalla-mapa').classList.add('activa');
  await consultarEstado();
  if(mapa){ setTimeout(()=>{ mapa.invalidateSize(); },200); }
  actualizar();
}

function modoSimulado(){
  modoGPS=false;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  document.getElementById('btn-sim').classList.add('activo');
  document.getElementById('btn-gps').classList.remove('activo');
  document.getElementById('instruccion').textContent='Toca el mapa para moverte — simula caminar por la ciudad';
}
function modoGPSReal(){
  if(!navigator.geolocation){alert('Tu navegador no permite geolocalización.');return;}
  modoGPS=true;
  document.getElementById('btn-gps').classList.add('activo');
  document.getElementById('btn-sim').classList.remove('activo');
  document.getElementById('instruccion').textContent='Usando tu GPS real — camina por la ciudad';
  watchId=navigator.geolocation.watchPosition(
    pos=>{posicion={lat:pos.coords.latitude,lng:pos.coords.longitude};if(mapa)mapa.setView([posicion.lat,posicion.lng],17);actualizar();},
    err=>{alert('No se pudo acceder al GPS. En el móvil, al aire libre, funcionará.');modoSimulado();},
    {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
  );
}

if ('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

iniciarSesion();
</script>
